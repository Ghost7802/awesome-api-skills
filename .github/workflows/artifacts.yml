name: Publish Artifacts

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish Build Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build All
        run: npm run build

      - name: Generate Integrity Report & Checksums
        run: npm run generate-integrity

      - name: Generate SBOM
        run: npm sbom --sbom-format=spdx > sbom.spdx.json

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/artifacts/registry.json
            dist/artifacts/search-index.json
            dist/artifacts/integrity-report.json
            checksums.txt
            sbom.spdx.json
